<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0F16">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Saison">
<title>Saison Restonica 69</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preload" href="fonts/archivo.woff2" as="font" type="font/woff2" crossorigin>
<script>
/* Thème choisi avant le premier rendu, pour éviter un flash */
(function(){ var t = null; try { t = localStorage.getItem('saison.theme'); } catch(e) {}
  if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t); })();
</script>
<style>
/* Quatre onglets : Semaine, Forme, Saison, Renfo. Chaque onglet commence par un résumé ; le détail s'ouvre en sous-page.
   Habillage « montagne » : un décor de crêtes en relief en haut des onglets (parallaxe au défilement),
   cartes en relief, barre d'onglets flottante. Pensé pour le téléphone. */
@font-face{font-family:'Archivo';src:url('fonts/archivo.woff2') format('woff2');font-weight:100 900;font-stretch:62% 125%;font-display:swap}
:root{
  --bg:#0A0F16; --card:#111924; --card-hi:#172232; --card-2:#1B2635; --line:#233145;
  --ink:#EEF3F8; --muted:#8E9DB2; --faint:#57667B; --nav:rgba(14,21,31,.86);
  --p0:#F2A65A; --pr:#7F8FA6; --p1:#5AA9FF; --p2:#3DDBB4; --p3:#FF7A66; --p4:#B9A8FF;
  --title:#8CCBFF; --on-accent:#04201A;
  --sky-a:#060A14; --sky-b:#16264A; --glow:#F0884A; --m1:#33486F; --m2:#26395E; --m3:#1A2A48; --m4:#111D32;
  --snow:rgba(255,255,255,.78); --shade:rgba(0,0,0,.2); --star:1;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 16px 30px -20px rgba(0,0,0,.85);
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --body:'Archivo','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F2F5F9; --card:#FFFFFF; --card-hi:#FFFFFF; --card-2:#E7EDF4; --line:#DAE2EC;
  --ink:#0F1A28; --muted:#55657A; --faint:#97A5B8; --nav:rgba(255,255,255,.88);
  --p0:#B5651D; --pr:#66768C; --p1:#1F6FD0; --p2:#0B8C6E; --p3:#C9432C; --p4:#6A52D9;
  --title:#1F6FD0; --on-accent:#FFFFFF;
  --sky-a:#B9D6F2; --sky-b:#FBE7D6; --glow:#FFB066; --m1:#8FB0D3; --m2:#A9C4E0; --m3:#C3D6EA; --m4:#DCE7F2;
  --snow:rgba(255,255,255,.95); --shade:rgba(30,70,120,.12); --star:0;
  --shadow:0 1px 2px rgba(15,26,40,.05),0 14px 28px -18px rgba(15,26,40,.28);
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px;border-radius:8px}

/* En-tête : transparent sur le décor, givré dès qu'on défile */
.top{position:sticky;top:0;z-index:20;padding-top:env(safe-area-inset-top,0px);border-bottom:1px solid transparent;transition:background .25s,border-color .25s}
.top.solid{background:var(--nav);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom-color:var(--line)}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px;height:57px;padding:0 max(18px,env(safe-area-inset-right,0px)) 0 max(18px,env(safe-area-inset-left,0px))}
.logo{width:32px;height:32px;border-radius:9px;flex:none;box-shadow:0 4px 12px -4px rgba(0,0,0,.5)}
.brand{font-family:var(--display);font-weight:800;font-stretch:118%;text-transform:uppercase;color:var(--ink);line-height:.95;font-size:13.5px;letter-spacing:.04em}
.brand span{display:block;font-size:9.5px;font-weight:600;letter-spacing:.34em;color:var(--title)}
.cd{margin-left:auto;font-family:var(--display);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.04em;padding:7px 12px;border-radius:20px;background:color-mix(in srgb,var(--card) 70%,transparent);border:1px solid color-mix(in srgb,var(--ink) 14%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.theme{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink);flex:none;background:color-mix(in srgb,var(--card) 70%,transparent);border:1px solid color-mix(in srgb,var(--ink) 14%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.theme svg{width:16px;height:16px}

/* Onglets : barre flottante */
.tabs{position:fixed;left:12px;right:12px;bottom:max(10px,calc(env(safe-area-inset-bottom,0px) - 12px));z-index:20;border-radius:26px;background:var(--nav);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border:1px solid color-mix(in srgb,var(--ink) 12%,transparent);box-shadow:0 18px 34px -14px rgba(0,0,0,.6)}
.tabs-in{max-width:536px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding:5px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border-radius:21px;font-size:10.5px;font-weight:600;letter-spacing:.03em;color:var(--muted);transition:background .2s,color .2s}
.tab svg{width:21px;height:21px}
.tab[aria-current="page"]{color:var(--p2);background:color-mix(in srgb,var(--p2) 14%,transparent)}

/* Pages */
.page{position:relative;max-width:560px;margin:0 auto;padding:16px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 104px) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.page > :not(.hero){position:relative;z-index:1}
.page.has-hero{padding-top:118px}
.hero{position:absolute;left:0;right:0;top:calc(-58px - env(safe-area-inset-top,0px));height:calc(318px + env(safe-area-inset-top,0px));z-index:0;overflow:hidden;pointer-events:none;-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
.hero svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero .ly{will-change:transform}
.page-h{display:flex;flex-direction:column;gap:5px}
.eyebrow{margin:0;font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.has-hero .eyebrow{color:color-mix(in srgb,var(--ink) 78%,transparent)}
.page-h h1{margin:0;font-family:var(--display);font-size:27px;font-weight:800;font-stretch:112%;text-transform:uppercase;line-height:1.04;letter-spacing:-.005em}
.sub{margin:0;font-size:14px;color:var(--muted)}
.has-hero .sub{color:color-mix(in srgb,var(--ink) 72%,transparent)}
.card{background:linear-gradient(180deg,var(--card-hi),var(--card));border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}
button.card,.drow,.prow{transition:transform .15s}
button.card:active,.prow:active{transform:scale(.985)}
.back{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;margin:-2px 0 -4px;padding:7px 14px 7px 9px;border-radius:20px;font-size:13px;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--line)}
.back svg{width:14px;height:14px;color:var(--p2)}
.sec{display:flex;flex-direction:column;gap:9px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 4px}
.sec-h h2{margin:0;font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.sec-h span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chev{flex:none;width:8px;height:8px;border-right:1.8px solid var(--faint);border-bottom:1.8px solid var(--faint);transform:rotate(-45deg);margin-right:3px}
.st{display:inline-block;font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:4px 10px;border-radius:12px;white-space:nowrap}
.st.ok{background:color-mix(in srgb,var(--p2) 18%,transparent);color:var(--p2)}
.st.mid{background:color-mix(in srgb,var(--p0) 18%,transparent);color:var(--p0)}
.st.low{background:color-mix(in srgb,var(--p3) 18%,transparent);color:var(--p3)}
.st.no{background:var(--card-2);color:var(--muted)}
.go{flex:none;font-size:11.5px;font-weight:800;font-stretch:108%;letter-spacing:.1em;text-transform:uppercase;color:var(--on-accent);background:linear-gradient(135deg,color-mix(in srgb,var(--p2) 82%,#fff),var(--p2));border-radius:22px;padding:11px 18px;box-shadow:0 10px 20px -10px var(--p2)}
.go.ghost{background:none;color:var(--p2);border:1px solid color-mix(in srgb,var(--p2) 60%,transparent);box-shadow:none}
.muted{color:var(--muted)}
.foot{margin:0;font-size:12px;color:var(--faint);text-align:center}

/* Semaine */
.today{position:relative;overflow:hidden;padding:18px;display:flex;flex-direction:column;gap:11px;align-items:flex-start;border-color:color-mix(in srgb,var(--p2) 38%,var(--line));background:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--p2) 17%,transparent),transparent 60%),linear-gradient(180deg,var(--card-hi),var(--card))}
.today .k{display:flex;align-items:center;gap:8px;font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--p2)}
.today .k::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--p2);box-shadow:0 0 0 4px color-mix(in srgb,var(--p2) 22%,transparent)}
.today .t{font-size:17px;font-weight:500;line-height:1.4}
.morning{width:100%;padding:15px 16px;display:flex;align-items:center;gap:12px}
.morning .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.morning .k{font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.morning .l{font-size:14.5px}
.days{list-style:none;margin:0;padding:2px 14px}
.days li{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.days li:last-child{border-bottom:0}
.box{flex:none;width:44px;height:50px;display:grid;place-items:center;margin-left:-10px}
.box i{width:22px;height:22px;border-radius:8px;border:1.5px solid var(--faint);display:grid;place-items:center;transition:background .15s,border-color .15s}
.box svg{width:13px;height:13px;opacity:0;stroke:var(--on-accent)}
.box.on i{background:var(--p2);border-color:var(--p2)}
.box.on svg{opacity:1}
.drow{flex:1;min-width:0;display:grid;grid-template-columns:38px 1fr auto auto;gap:10px;align-items:center;padding:12px 0}
.dj{font-family:var(--display);font-size:12.5px;font-weight:800;font-stretch:108%;text-transform:uppercase;letter-spacing:.04em;line-height:1.2}
.dj small{display:block;font-size:11px;font-weight:400;font-stretch:100%;color:var(--muted);letter-spacing:0}
.dt{min-width:0;font-size:14.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
li.is-today .dj{color:var(--p2)}
li.is-done .dt{color:var(--muted)}
.wkbar{padding:13px 16px 15px;display:flex;flex-direction:column;gap:9px;border-top:1px solid var(--line)}
.wkbar .l{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.wkbar .l b{color:var(--ink);font-weight:700}
.trk{height:6px;background:var(--card-2);border-radius:3px;overflow:hidden}
.trk i{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--c,var(--p2)) 65%,transparent),var(--c,var(--p2)));border-radius:3px}

/* Sous-pages : blocs simples */
.blk{padding:15px 16px;display:flex;flex-direction:column;gap:8px}
.blk .k{font-size:10.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.blk p{margin:0}
.blk .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.blk .acts:empty{display:none}
.act{display:flex;flex-direction:column;gap:1px}
.act + .act{padding-top:8px;border-top:1px solid var(--line)}
.act b{font-weight:600}
.act span{font-size:13.5px;color:var(--muted)}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big3 .v{font-family:var(--display);font-size:27px;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
.big3 .v small{font-size:11.5px;color:var(--muted);font-weight:500}
.big3 .l{font-size:10.5px;font-weight:600;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
.lines{display:flex;flex-direction:column}
.ln{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ln:last-child{border-bottom:0}
.ln .d{width:10px;height:10px;border-radius:50%;background:var(--faint)}
.ln .d.ok{background:var(--p2)} .ln .d.mid{background:var(--p0)} .ln .d.low{background:var(--p3)}
.ln .r{color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ln .r b{color:var(--ink);font-weight:600;font-size:14px}

/* Forme : une carte par sujet, 7 cases pour la semaine */
.fnav{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.fnav .nav{display:flex;gap:6px;flex:none}
.fnav .nav button{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink);background:color-mix(in srgb,var(--card) 75%,transparent);border:1px solid color-mix(in srgb,var(--ink) 14%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.fnav .nav button:disabled{opacity:.35;cursor:default}
.fnav .nav svg{width:16px;height:16px}
.fcard{width:100%;padding:15px 16px 16px;display:flex;flex-direction:column;gap:12px}
.fh{display:flex;align-items:center;gap:10px;width:100%}
.fh .t{font-family:var(--display);font-size:15px;font-weight:800;font-stretch:112%;text-transform:uppercase;letter-spacing:.02em;line-height:1;white-space:nowrap}
.fh .s{margin-left:auto;font-size:13px;color:var(--muted);text-align:right;line-height:1.3}
.fh .s b{color:var(--ink);font-weight:600}
.rl{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:-6px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;width:100%}
.strip div{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:var(--muted);min-width:0}
.strip div span.td{color:var(--p2);font-weight:700}
.strip i{width:100%;max-width:46px;aspect-ratio:1;border-radius:11px;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-stretch:84%;font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink);border:1px dashed var(--line);white-space:nowrap;overflow:hidden}
.strip i.n{border:0;background:var(--card-2)}
.strip i.ok{border:0;background:color-mix(in srgb,var(--p2) 30%,var(--card-2))}
.strip i.mid{border:0;background:color-mix(in srgb,var(--p0) 32%,var(--card-2))}
.strip i.low{border:0;background:color-mix(in srgb,var(--p3) 30%,var(--card-2));box-shadow:inset 0 0 0 2px var(--p3)}
.strip i.fut{border-style:dotted;opacity:.45}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:58px 1fr;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.hrow:last-child{border-bottom:0}
.hrow .hd{font-family:var(--display);font-size:12.5px;font-weight:800;font-stretch:108%;text-transform:uppercase;letter-spacing:.04em;line-height:1.25}
.hrow .hd small{display:block;font-size:11px;font-weight:400;font-stretch:100%;color:var(--muted);letter-spacing:0;text-transform:none}
.hrow .hv{display:flex;flex-direction:column;gap:3px}
.hrow .hv .muted{font-size:13px}
.trend svg{width:100%;height:auto;display:block;touch-action:pan-y}
.trend svg text{font-family:var(--body);font-size:9px;fill:var(--muted)}
.trend .ro{font-size:13px;color:var(--muted);min-height:1.4em;font-variant-numeric:tabular-nums}
.trend .ro b{color:var(--ink);font-weight:600}
.ref{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.ref b{color:var(--ink);font-weight:600}

/* Saison */
.prows,.races{overflow:hidden}
.prow{width:100%;display:grid;grid-template-columns:10px 1fr auto 10px;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.prows > :last-child{border-bottom:0}
.prow .dot{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 20%,transparent)}
.prow .n{font-family:var(--display);font-size:14.5px;font-weight:800;font-stretch:110%;text-transform:uppercase;letter-spacing:.02em;line-height:1.1}
.prow .n small{display:block;font-size:12.5px;font-weight:400;font-stretch:100%;text-transform:none;letter-spacing:0;color:var(--muted);margin-top:4px}
.prow .dd{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.prow.past .n{color:var(--muted)}
.prow.cur{background:linear-gradient(120deg,color-mix(in srgb,var(--c) 16%,transparent),transparent 70%)}
.prow.cur .n{color:var(--c)}
.prow .wk{grid-column:2 / 5;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
.race{display:grid;grid-template-columns:56px 1fr auto;gap:2px 12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.races > :last-child{border-bottom:0}
.race .d{font-family:var(--display);font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.race .rn{font-weight:600;font-size:15px;line-height:1.25}
.race .f{grid-column:2;font-size:12.5px;color:var(--muted)}
.race .r{grid-row:1 / 3;grid-column:3;text-align:right;font-size:12.5px;color:var(--muted);white-space:nowrap}
.race .r b{display:block;font-family:var(--display);font-size:16px;color:var(--ink);font-weight:800}
.race.key .rn::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-left:7px;transform:translateY(-2px)}
.race.past .d,.race.past .rn{color:var(--muted)}
.race.next{background:linear-gradient(120deg,color-mix(in srgb,var(--p2) 15%,transparent),transparent 75%)}
.race.next .r b{color:var(--p2);font-size:19px}
.race.final{background:linear-gradient(135deg,color-mix(in srgb,var(--title) 24%,transparent),transparent 75%)}
.race.final .rn{font-family:var(--display);font-weight:800;font-stretch:112%;text-transform:uppercase;color:var(--title);font-size:14px;letter-spacing:.02em}
.ok-tag{display:inline-block;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--on-accent);background:var(--p2);border-radius:10px;padding:3px 9px}
.focus{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px}
.focus li{position:relative;padding-left:16px}
.focus li::before{content:"";position:absolute;left:0;top:.5em;width:6px;height:6px;border-radius:50%;background:var(--c,var(--p2))}
.wk-type{display:grid;grid-template-columns:38px 1fr;gap:7px 10px;font-size:14px;margin:0}
.wk-type dt{font-family:var(--display);font-size:12.5px;font-weight:800;font-stretch:108%;color:var(--c);text-transform:uppercase;padding-top:1px}
.wk-type dd{margin:0}
.wkr{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;font-size:13px}
.wkr .wd{color:var(--muted);font-variant-numeric:tabular-nums}
.wkr .wb{position:relative;height:6px;background:var(--card-2);border-radius:3px}
.wkr .wb i{position:absolute;left:0;top:0;bottom:0;background:var(--c);border-radius:3px}
.wkr .wb b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45}
.wkr .wv{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.wkr .wv span{color:var(--muted)}
.wkr.fut{opacity:.45}
.wkn{font-size:12.5px;color:var(--muted);margin:-4px 0 4px 50px}

/* Renfo : le carnet est dans la page (le cadre prend la hauteur de son contenu) et c'est la page qui défile.
   Sur iPhone, en appli écran d'accueil, une page bloquée fait remonter les onglets : on ne la bloque pas.
   Pendant une séance, l'en-tête et les onglets disparaissent et la séance prend tout l'écran. */
.page.rf{display:block;max-width:none;margin:0;padding:0 0 calc(env(safe-area-inset-bottom,0px) + 96px);min-height:calc(100vh + 1px);background:var(--bg)}
.page.rf iframe{display:block;width:100%;height:100vh;border:0;background:var(--bg)}
html.focus,html.focus body{overflow:hidden;overscroll-behavior:none}
html.focus .top,html.focus .tabs{display:none}
html.focus .page.rf{position:fixed;inset:0;z-index:30;min-height:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
html.focus .page.rf iframe{flex:1;height:100%;min-height:0}
@media (min-width:600px){ .page.rf{width:560px;margin:0 auto} .tabs{left:50%;right:auto;width:536px;transform:translateX(-50%)} }
@media (max-width:359px){.strip{gap:4px}.strip i{font-size:11.5px;border-radius:9px}.page-h h1{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="top-in">
    <img class="logo" src="logo.svg" alt="" width="32" height="32">
    <div class="brand">Restonica<span>Trail</span></div>
    <div class="cd" id="cd">—</div>
    <button class="theme" id="theme" aria-label="Changer de thème"></button>
  </div>
</header>

<main class="page" id="view"></main>
<main class="page rf" id="p-renfo" hidden><iframe id="rf-frame" title="Carnet de renfo"></iframe></main>

<nav class="tabs" aria-label="Pages">
  <div class="tabs-in">
    <button class="tab" data-p="semaine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17M8.5 15l2 2 4-4"/></svg>Semaine</button>
    <button class="tab" data-p="forme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12.5h4l2.5-6 4.5 12 2.5-6h5.5"/></svg>Forme</button>
    <button class="tab" data-p="saison"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19l6-10 4 6 3-4 5 8z"/></svg>Saison</button>
    <button class="tab" data-p="renfo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9a4 4 0 0 1 8 0"/><circle cx="12" cy="15" r="6"/></svg>Renfo</button>
  </div>
</nav>

<script src="plan.js"></script>
<script>
/* ---------- Outils ---------- */
const D = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const add = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const fmt = d => String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const nf = n => Math.round(n).toLocaleString('fr-FR');
const dec = (n, d) => (+n).toFixed(d).replace('.', ',');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAY = 86400000, $ = id => document.getElementById(id);
const JOURS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const longDate = d => JOURS[(d.getDay()+6)%7] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()];
const hrs = s => { const m = String(s || '').match(/(\d+)\s*h\s*(\d+)?/); return m ? +m[1] + (+(m[2] || 0))/60 : null; };
const hm = h => { const t = Math.round(h*60); return Math.floor(t/60) + 'h' + String(t%60).padStart(2,'0'); };
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
const CHEV = '<span class="chev" aria-hidden="true"></span>';
const BACK = t => '<button class="back" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>' + t + '</button>';

let WEEKS = {}, RESULTS = {}, PLANS = {}, SLEEP = {}, PAS = {}, SEANCES = {}, DOS = {}, DOUL = {}, MAJ = '';
let today = new Date(); today.setHours(0,0,0,0);
const S0 = D('2026-10-26'), RACE = D('2027-07-10');
const PIED = ['Run','TrailRun','Hike','Walk','VirtualRun'];

/* ---------- Plan ---------- */
const status = p => today < D(p.start) ? 'future' : (today > D(p.end) ? 'past' : 'current');
const current = () => PHASES.find(p => !p.pre && status(p) === 'current') || PHASES.find(p => status(p) === 'current');
const mondayOf = d => add(d, -((d.getDay()+6)%7));
const weekNo = d => Math.max(1, Math.min(37, Math.floor((mondayOf(d) - S0) / (7*DAY)) + 1));
function weeksOf(p){
  const out = []; for (let w = D(p.start); w <= D(p.end); w = add(w, 7)) out.push(w);
  return out.map((w,i,a) => { const r = a.length > 1 ? i/(a.length-1) : 0;
    return { start:w, key:iso(w), tKm:p.km[0]+(p.km[1]-p.km[0])*r, tDp:p.dp[0]+(p.dp[1]-p.dp[0])*r }; });
}
const targetOf = mon => { for (const p of PHASES){ if (p.pre) continue; const w = weeksOf(p).find(x => x.key === iso(mon)); if (w) return w; } return null; };
function renfoId(s){
  s = String(s).toLowerCase();
  if (s.includes('post-course')) return 'postcourse';
  if (s.includes('programme 1') || s.includes('hanches')) return 'hanches';
  if (s.includes('programme 2') || s.includes('quadri') || s.includes('ischio')) return 'quadri';
  if (s.includes('programme 3') || s.includes('mollets')) return 'mollets';
  if (s.includes('mobilit')) return 'mobilite';
  return null;
}
/* Titre court d'une séance : celui du plan s'il existe, sinon le début du texte */
function titre(j){
  if (j.titre) return j.titre;
  const s = String(j.seance || '').split(/ : |\. | · |\(/)[0].trim();
  return s.length > 44 ? s.slice(0, 42) + '…' : s;
}
function weekPlan(mon){
  const k = iso(mon); let jours;
  if (PLANS[k] && Array.isArray(PLANS[k].jours)) jours = PLANS[k].jours.map(j => Object.assign({}, j));
  else { const p = PHASES.find(x => D(x.start) <= mon && mon <= D(x.end)) || current(); jours = (p ? p.week : []).map(([j,s]) => ({ jour:j, seance:s })); }
  const c = lsGet('saison.coches.' + k, {});
  jours.forEach((j,i) => { const day = iso(add(mon, i)); j.date = day; j.acts = SEANCES[day] || []; j.coche = !!c[i]; j.fait = j.coche || j.acts.length > 0; });
  return { jours, prevu: PLANS[k] && PLANS[k].prevu };
}
function toggleDay(mon, i){
  const k = 'saison.coches.' + iso(mon), c = lsGet(k, {});
  c[i] = !c[i]; lsSet(k, c); route();
}
const vfcSt = v => !v ? 'no' : v >= 80 ? 'ok' : v >= 70 ? 'mid' : 'low';
const VFC_TXT = { ok:'Récupéré', mid:'Correct', low:'Journée facile', no:'Pas de VFC' };
const slpSt = h => h == null ? 'no' : h >= 7 ? 'ok' : h >= 6 ? 'mid' : 'low';
const DOS_ST = { ok:'ok', gene:'mid', douleur:'low' };
const dosTxt = x => x ? (x.score != null ? x.score + '/10' : ({ ok:'rien', gene:'gêne', douleur:'douleur' }[x.etat] || '')) : '';
const footKm = acts => acts.filter(a => PIED.includes(a.type)).reduce((t,a) => t + (+a.km || 0), 0);
function actLine(a){
  return '<div class="act"><b>' + esc(a.nom) + '</b><span>' + [a.km ? dec(a.km, 1) + ' km' : '', a.dp ? nf(a.dp) + ' m D+' : '', a.duree ? esc(a.duree) : '', a.fc ? 'FC ' + a.fc : ''].filter(Boolean).join(' · ') + '</span></div>';
}
function lastNight(){
  if (SLEEP[iso(today)]) return iso(today);
  const k = Object.keys(SLEEP).sort(); return k.length ? k[k.length-1] : null;
}

/* ---------- Thème ---------- */
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  document.querySelector('meta[name="theme-color"]').content = t === 'light' ? '#BDD8F2' : '#060A14';
  $('theme').innerHTML = t === 'light' ? MOON : SUN;
  $('theme').setAttribute('aria-label', t === 'light' ? 'Passer en sombre' : 'Passer en clair');
  try { $('rf-frame').contentDocument.documentElement.setAttribute('data-theme', t); } catch(e) {}
}
$('theme').onclick = () => {
  const t = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  try { localStorage.setItem('saison.theme', t); } catch(e) {}
  applyTheme(t);
};
applyTheme(document.documentElement.getAttribute('data-theme'));

/* ================= DÉCOR : crêtes en relief ================= */
/* Quatre plans de montagnes dessinés à facettes (lumière à gauche), du plus lointain au plus proche ;
   chaque plan glisse à sa vitesse quand on défile. Semaine : soleil. Forme : lune. Saison : la trace vers le sommet. */
const lcg = seed => () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
function ridge(seed, base, amp){
  const r = lcg(seed), p = [], ph = r() * 6, f = .011 + r() * .007; let x = -24;
  while (x <= 416){ p.push([x, base - amp * (.6 * Math.pow(Math.abs(Math.sin(x * f + ph)), 1.4) + .28 * Math.abs(Math.sin(x * f * 2.7 + ph * 2)) + .12 * r())]); x += 9 + r() * 14; }
  return p;
}
const P = a => a.map(q => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' L');
function layer(pts, fill, k, snow, extra){
  let s = '<path d="M-24 330 L' + P(pts) + ' L416 330Z" fill="' + fill + '"/>';
  for (let i = 1; i < pts.length - 1; i++){
    if (!(pts[i][1] < pts[i-1][1] && pts[i][1] < pts[i+1][1])) continue;
    let j = i; while (j < pts.length - 1 && pts[j+1][1] > pts[j][1]) j++;
    s += '<path d="M' + P(pts.slice(i, j + 1)) + ' L' + pts[j][0].toFixed(1) + ' 330 L' + (pts[i][0] + (pts[j][0] - pts[i][0]) * .22).toFixed(1) + ' 330Z" fill="var(--shade)"/>';
    if (snow){ const a = pts[i], l = pts[i-1], r = pts[i+1], m = (u, t) => [a[0] + (u[0] - a[0]) * t, a[1] + (u[1] - a[1]) * t], L = m(l, .5), R = m(r, .5);
      s += '<path d="M' + P([a, L, [a[0] - 2, L[1] - 3], [a[0] + 1.5, (L[1] + R[1]) / 2 + 2], [a[0] + 4, R[1] - 3], R]) + 'Z" fill="var(--snow)"/>'; }
  }
  return '<g class="ly" data-k="' + k + '">' + s + (extra || '') + '</g>';
}
function hero(kind, prog){
  const l2 = ridge(kind === 'trail' ? 23 : kind === 'moon' ? 41 : 7, 182, 84);
  let extra = '', sky = '';
  if (kind === 'trail'){ // la trace suit la crête jusqu'au sommet ; le point = la semaine en cours
    let s = 0; l2.forEach((q,i) => { if (q[0] > 150 && q[0] < 345 && q[1] < l2[s][1]) s = i; }); if (!s) s = l2.length >> 1;
    const tr = l2.filter((q,i) => q[0] >= 28 && i <= s), len = [0];
    for (let i = 1; i < tr.length; i++) len.push(len[i-1] + Math.hypot(tr[i][0] - tr[i-1][0], tr[i][1] - tr[i-1][1]));
    const goal = len[len.length-1] * Math.max(0, Math.min(1, prog)); let i = 1; while (i < tr.length - 1 && len[i] < goal) i++;
    const t = (goal - len[i-1]) / ((len[i] - len[i-1]) || 1), mk = [tr[i-1][0] + (tr[i][0] - tr[i-1][0]) * t, tr[i-1][1] + (tr[i][1] - tr[i-1][1]) * t], top = tr[tr.length-1];
    extra = '<path d="M' + P(tr) + '" fill="none" stroke="var(--ink)" stroke-opacity=".7" stroke-width="1.6" stroke-dasharray="1 5" stroke-linecap="round"/>' +
      '<path d="M' + P(tr.slice(0, i).concat([mk])) + '" fill="none" stroke="var(--p2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<path d="M' + top[0].toFixed(1) + ' ' + top[1].toFixed(1) + 'v-17" stroke="var(--ink)" stroke-width="1.6" stroke-linecap="round"/><path d="M' + top[0].toFixed(1) + ' ' + (top[1] - 17).toFixed(1) + 'l11 4 -11 4z" fill="var(--p0)"/>' +
      '<circle cx="' + mk[0].toFixed(1) + '" cy="' + mk[1].toFixed(1) + '" r="9" fill="var(--p2)" opacity=".28"/><circle cx="' + mk[0].toFixed(1) + '" cy="' + mk[1].toFixed(1) + '" r="4.6" fill="var(--p2)" stroke="var(--bg)" stroke-width="2"/>';
  }
  const r = lcg(99); let stars = '';
  for (let i = 0; i < 34; i++) stars += '<circle cx="' + (r() * 390).toFixed(0) + '" cy="' + (r() * 150).toFixed(0) + '" r="' + (.4 + r() * .8).toFixed(1) + '" fill="#fff" opacity="' + (.25 + r() * .6).toFixed(2) + '"/>';
  if (kind === 'moon') sky = '<circle cx="212" cy="74" r="34" fill="url(#hg2)"/><circle cx="212" cy="74" r="10.5" fill="#F4F1E6"/><circle cx="216.5" cy="71" r="9" fill="var(--sky-b)" opacity=".92"/>';
  else sky = '<circle cx="' + (kind === 'trail' ? 96 : 292) + '" cy="168" r="150" fill="url(#hg)"/>' + (kind === 'sun' ? '<circle cx="292" cy="150" r="17" fill="var(--glow)" opacity=".95"/>' : '');
  return '<div class="hero" aria-hidden="true"><svg viewBox="0 0 390 318" preserveAspectRatio="xMidYMax slice"><defs>' +
    '<linearGradient id="hs" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--sky-a)"/><stop offset=".72" stop-color="var(--sky-b)"/></linearGradient>' +
    '<radialGradient id="hg"><stop offset="0" stop-color="var(--glow)" stop-opacity=".6"/><stop offset=".45" stop-color="var(--glow)" stop-opacity=".16"/><stop offset="1" stop-color="var(--glow)" stop-opacity="0"/></radialGradient>' +
    '<radialGradient id="hg2"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs>' +
    '<rect x="-30" y="-80" width="450" height="420" fill="url(#hs)"/><g style="opacity:var(--star)">' + stars + '</g><g class="ly" data-k=".42">' + sky + '</g>' +
    layer(ridge(3, 172, 58), 'var(--m1)', .3, false) + layer(l2, 'var(--m2)', .22, true, extra) +
    layer(ridge(11, 214, 30), 'var(--m3)', .14, false) + layer(ridge(17, 244, 26), 'var(--m4)', .07, false) + layer(ridge(29, 274, 20), 'var(--bg)', 0, false) +
    '</svg></div>';
}
function paral(){
  const y = Math.max(0, window.scrollY), red = matchMedia('(prefers-reduced-motion: reduce)').matches;
  $('top').classList.toggle('solid', y > ($('view').classList.contains('has-hero') && !$('view').hidden ? 150 : 4));
  if (!red && y < 420) document.querySelectorAll('.hero .ly').forEach(g => { g.style.transform = 'translate3d(0,' + (y * +g.dataset.k).toFixed(1) + 'px,0)'; });
}
window.addEventListener('scroll', paral, { passive:true });

/* ================= SEMAINE ================= */
function vSemaine(){
  const mon = mondayOf(today), w = weekPlan(mon), ti = (today.getDay()+6)%7, p = current();
  const tj = w.jours[ti], rid = tj && renfoId(tj.seance);
  // Aujourd'hui
  let h = hero('sun') + '<div class="page-h"><p class="eyebrow">Semaine ' + weekNo(today) + (p ? ' · ' + esc(p.name) : '') + '</p><h1>' + longDate(today) + '</h1></div>';
  if (tj) h += '<div class="card today"><div class="k">Aujourd\'hui</div><div class="t">' + esc(tj.seance) + '</div>' +
    (rid && !tj.fait ? '<button class="go" data-renfo="' + rid + '">Lancer la séance</button>' : '') + '</div>';
  // Ce matin
  const nk = lastNight(), n = nk ? SLEEP[nk] : null, ds = DOS[iso(today)], fresh = nk === iso(today);
  const st = fresh ? vfcSt(+n.vfc) : 'no';
  const bits = fresh ? [n.duree ? esc(n.duree) + ' de sommeil' : '', n.vfc ? 'VFC ' + n.vfc : ''] : ['Pas encore de nuit · ouvre l\'app Suunto'];
  bits.push(ds ? 'dos ' + dosTxt(ds) : 'dos : à me dire');
  h += '<button class="card morning" data-go="#forme"><div class="m"><div class="k">Ce matin</div>' +
    '<div><span class="st ' + st + '">' + (fresh ? VFC_TXT[st] : 'En attente') + '</span></div><div class="l">' + bits.filter(Boolean).join(' · ') + '</div></div>' + CHEV + '</button>';
  // La semaine
  const a = WEEKS[iso(mon)] || {}, tg = targetOf(mon), km = +a.km || 0, dp = +a.dplus || 0;
  h += '<div class="sec"><div class="sec-h"><h2>La semaine</h2><span>' + w.jours.filter(j => j.fait).length + ' / ' + w.jours.length + ' fait</span></div><div class="card"><ul class="days">' +
    w.jours.map((j,i) => {
      const d = add(mon, i), k = footKm(j.acts), meta = k > 0 ? dec(k, k < 10 ? 1 : 0) + ' km' : (j.acts.length ? 'fait' : '');
      return '<li class="' + (i === ti ? 'is-today ' : '') + (j.fait ? 'is-done' : '') + '"><button class="box' + (j.fait ? ' on' : '') + '" data-tog="' + i + '" aria-label="Marquer ' + JOURS[i] + ' comme fait" aria-pressed="' + j.fait + '"><i><svg viewBox="0 0 24 24" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i></button>' +
        '<button class="drow" data-go="#semaine/jour/' + iso(d) + '"><span class="dj">' + esc(j.jour) + '<small>' + fmt(d) + '</small></span><span class="dt">' + esc(titre(j)) + '</span><span class="dm">' + meta + '</span>' + CHEV + '</button></li>';
    }).join('') + '</ul>' +
    '<div class="wkbar"><div class="l"><span><b>' + nf(km) + ' km</b> · ' + nf(dp) + ' m D+</span><span>' + (w.prevu ? esc(String(w.prevu).split(' dont')[0].split(' · ')[0]) : (tg ? '~' + nf(tg.tKm) + ' km' : '')) + '</span></div>' +
    (tg ? '<div class="trk"><i style="width:' + Math.min(100, km / tg.tKm * 100).toFixed(1) + '%"></i></div>' : '') + '</div></div></div>';
  $('view').innerHTML = h;
  $('view').querySelectorAll('[data-tog]').forEach(b => b.onclick = () => toggleDay(mon, +b.dataset.tog));
}

/* Sous-page : un jour */
function vJour(day){
  const d = D(day), mon = mondayOf(d), i = (d.getDay()+6)%7, w = weekPlan(mon), j = w.jours[i] || { seance:'', acts:[] };
  const n = SLEEP[day], ds = DOS[day], fut = d > today, rid = renfoId(j.seance), pas = PAS[day];
  let h = BACK('Semaine') + '<div class="page-h"><p class="eyebrow">' + (day === iso(today) ? 'Aujourd\'hui · ' : '') + longDate(d) + '</p><h1>' + esc(titre(j) || 'Libre') + '</h1></div>';
  if (j.seance) h += '<div class="card blk"><div class="k">Prévu</div><p>' + esc(j.seance) + '</p><div class="acts">' +
    (rid && !j.fait && !fut ? '<button class="go" data-renfo="' + rid + '">Lancer la séance</button>' : '') +
    (!j.acts.length && !fut ? '<button class="go ghost" data-tog="' + i + '">' + (j.coche ? 'Pas fait finalement' : 'Marquer comme fait') + '</button>' : '') + '</div></div>';
  if (j.acts.length) h += '<div class="card blk"><div class="k">Fait</div>' + j.acts.map(actLine).join('') + '</div>';
  if (n) h += '<div class="card blk"><div class="k">Nuit</div><p>' + [n.coucher && n.lever ? esc(n.coucher) + ' → ' + esc(n.lever) : '', n.duree ? esc(n.duree) : '', n.vfc ? 'VFC ' + n.vfc : '', n.fc_min ? 'FC min ' + n.fc_min : ''].filter(Boolean).join(' · ') +
    '</p>' + (n.note ? '<p class="muted">' + esc(n.note) + '</p>' : '') + '</div>';

/* VFC et durée de sommeil sur 21 jours : deux petits graphiques l'un sous l'autre, un seul axe chacun */
function trend(box){

  const W = 320, H1 = 92, G = 18, H2 = 46, H = H1 + G + H2 + 16, L = 4, R = 4, step = (W - L - R) / N, cx = i => L + step * (i + .5);
  const lo = 50, hi = 110, yv = v => 14 + (hi - Math.max(lo, Math.min(hi, v))) / (hi - lo) * (H1 - 20), y2 = h => H1 + G + H2 - Math.min(11, h) / 11 * H2;
  const data = days.map(d => { const n = SLEEP[iso(d)] || {}; return { d, v:+n.vfc || null, h:hrs(n.duree), f:+n.fc_min || null }; });
  let s = '<text x="' + L + '" y="9">VFC (ms)</text><text x="' + L + '" y="' + (H1 + G - 3) + '">Sommeil (h)</text>';

  s += '<line x1="0" x2="' + W + '" y1="' + yv(70).toFixed(1) + '" y2="' + yv(70).toFixed(1) + '" stroke="var(--p3)" stroke-dasharray="3 3" opacity=".7"/>';
  s += '<text x="' + (W - R) + '" y="' + (yv(90) - 3).toFixed(1) + '" text-anchor="end">80-90</text><text x="' + (W - R) + '" y="' + (yv(70) + 10).toFixed(1) + '" text-anchor="end">70</text>';
  s += '<path d="' + data.map((p,i) => p.v ? ((i && data[i-1].v ? 'L' : 'M') + cx(i).toFixed(1) + ' ' + yv(p.v).toFixed(1)) : '').join(' ') + '" fill="none" stroke="var(--p2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  s += data.map((p,i) => p.v ? '<circle cx="' + cx(i).toFixed(1) + '" cy="' + yv(p.v).toFixed(1) + '" r="3.4" fill="var(--p2)" stroke="var(--card)" stroke-width="2"/>' : '').join('');
  s += '<line x1="0" x2="' + W + '" y1="' + y2(7).toFixed(1) + '" y2="' + y2(7).toFixed(1) + '" stroke="var(--muted)" stroke-dasharray="3 3" opacity=".6"/><text x="' + (W - R) + '" y="' + (y2(7) - 3).toFixed(1) + '" text-anchor="end">7 h</text>';
  s += data.map((p,i) => p.h != null ? '<rect x="' + (cx(i) - step/2 + 1.5).toFixed(1) + '" y="' + y2(p.h).toFixed(1) + '" width="' + (step - 3).toFixed(1) + '" height="' + (H1 + G + H2 - y2(p.h)).toFixed(1) + '" rx="2.5" fill="var(--p4)" opacity=".85"/>' : '').join('');
  s += '<line id="f-x" x1="-10" x2="-10" y1="0" y2="' + (H1 + G + H2) + '" stroke="var(--ink)" stroke-width="1" opacity=".5"/>';
  s += [0, 7, 14, 20].map(i => '<text x="' + cx(i).toFixed(1) + '" y="' + (H - 3) + '" text-anchor="middle">' + fmt(days[i]) + '</text>').join('');
  box.innerHTML = '<div class="k">3 dernières semaines</div><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="VFC et durée de sommeil sur 21 jours">' + s + '</svg><div class="ro" id="f-ro">Touche le graphique pour lire une nuit.</div>';
  const el = box.querySelector('svg');
  const read = e => {
    const r = el.getBoundingClientRect(), i = Math.max(0, Math.min(N - 1, Math.floor(((e.clientX - r.left) / r.width * W - L) / step))), p = data[i];
    $('f-x').setAttribute('x1', cx(i)); $('f-x').setAttribute('x2', cx(i));
    $('f-ro').innerHTML = JOURS[(p.d.getDay()+6)%7].slice(0,3) + '. ' + fmt(p.d) + ' · ' + (p.v || p.h != null ? 'VFC <b>' + (p.v || '—') + '</b> · sommeil <b>' + (p.h != null ? hm(p.h) : '—') + '</b>' + (p.f ? ' · FC min ' + p.f : '') : 'pas de nuit enregistrée');
  };
  el.addEventListener('pointermove', read); el.addEventListener('pointerdown', read);
}

/* #semaine, #semaine/jour/AAAA-MM-JJ, #semaine/forme, #saison, #saison/phase/<id>, #renfo */
const TABS = ['semaine','forme','saison','renfo'], mem = {};
let curKey = null, fromApp = false;
function route(){
  const parts = location.hash.slice(1).split('/'), tab = TABS.includes(parts[0]) ? parts[0] : 'semaine', key = parts.join('/') || 'semaine';
  if (curKey && curKey !== key) mem[curKey] = window.scrollY;
  const isRf = tab === 'renfo';
  $('view').hidden = isRf; $('p-renfo').hidden = !isRf;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.p === tab ? 'page' : 'false'));
  if (!isRf) document.documentElement.classList.remove('focus');
  if (isRf) loadRenfo().then(sizeRenfo);
  else if (parts[1] === 'jour' && /^\d{4}-\d{2}-\d{2}$/.test(parts[2] || '')) vJour(parts[2]);
  else if (tab === 'forme' && parts[1] === 'dos') vDos();
  else if (tab === 'forme' && parts[1] === 'douleurs') vDouleurs();
  else if (tab === 'forme' && parts[1] === 'sommeil') vSommeil();
  else if (tab === 'forme' || parts[1] === 'forme') vForme();
  else if (tab === 'saison' && parts[1] === 'phase') vPhase(parts[2]);
  else if (tab === 'saison') vSaison();
  else vSemaine();
  const isSub = parts.length > 1;
  if (curKey !== key) window.scrollTo(0, isSub ? 0 : (mem[key] || 0));
  curKey = key;
  $('view').classList.toggle('has-hero', !!$('view').querySelector('.hero'));
  paral();
}
function go(h, push){
  h = '#' + h.replace(/^#/, '');
  if (location.hash === h) return route();
  if (push) { fromApp = true; location.hash = h; }
  else { history.replaceState(null, '', h); route(); }
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { const p = t.dataset.p; mem[p] = 0; fromApp = false; go(p); });
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go, true); return; }
  const b = e.target.closest('[data-back]'); if (b) { if (fromApp) history.back(); else go(location.hash.slice(1).split('/')[0]); return; }
  const r = e.target.closest('[data-renfo]'); if (r) openRenfo(r.dataset.renfo);
});
window.addEventListener('hashchange', route);

/* ================= RENFO ================= */
let rfLoaded = null;
function loadRenfo(){
  const fr = $('rf-frame');
  if (!rfLoaded) rfLoaded = new Promise(r => { fr.onload = () => {
    applyTheme(document.documentElement.getAttribute('data-theme'));
    try { const w = fr.contentWindow, app = w.document.querySelector('.app'); if (app && w.ResizeObserver) new w.ResizeObserver(sizeRenfo).observe(app); } catch(e) {}
    sizeRenfo(); r();
  }; fr.src = 'renfo.html'; });
  return rfLoaded;
}
/* Hors séance, le cadre fait la hauteur du carnet (la page défile) ; en séance, il prend tout l'écran. */
function sizeRenfo(){
  const fr = $('rf-frame'); let doc;
  try { doc = fr.contentDocument; } catch(e) { return; }
  if (!doc || !doc.documentElement) return;
  const focus = document.documentElement.classList.contains('focus');
  doc.documentElement.classList.toggle('flow', !focus);
  if (focus){ fr.style.height = ''; return; }
  const app = doc.querySelector('.app'), h = Math.ceil(app ? app.getBoundingClientRect().height : doc.body.scrollHeight);
  if (h > 0) fr.style.height = h + 'px';
}
async function openRenfo(id){
  go('renfo'); await loadRenfo();
  try { $('rf-frame').contentWindow.start(id); } catch(e) {}
}
window.addEventListener('message', e => {
  const m = e.data; if (!m || e.source !== $('rf-frame').contentWindow) return;
  if (m.type === 'renfo-screen'){
    const was = document.documentElement.classList.contains('focus'), now = m.screen === 'session';
    document.documentElement.classList.toggle('focus', now); sizeRenfo();
    if (was && !now) window.scrollTo(0, 0);
    return;
  }
  if (m.type !== 'renfo-done') return;
  const mon = mondayOf(today), ti = (today.getDay()+6)%7, j = weekPlan(mon).jours[ti];
  if (j && !j.fait && renfoId(j.seance) === m.id){ const k = 'saison.coches.' + iso(mon), c = lsGet(k, {}); c[ti] = true; lsSet(k, c); }
});

/* ================= DONNÉES ================= */
function apply(d){
  WEEKS = d.semaines || {}; RESULTS = d.resultats || {}; PLANS = d.plan || {}; SLEEP = d.sommeil || {};
  PAS = d.pas || {}; SEANCES = d.seances || {}; DOS = d.dos || {}; DOUL = d.douleurs || {}; MAJ = d.maj || '';
}
function header(){ const d = Math.ceil((RACE - today) / DAY); $('cd').textContent = d > 0 ? 'J-' + d : 'Jour J'; }
async function loadData(){
  today = new Date(); today.setHours(0,0,0,0);
  try {
    const r = await fetch('data.json?t=' + Date.now(), { cache:'no-store' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json(); apply(d); lsSet('saison.data', d);
  } catch(e) { const d = lsGet('saison.data', null); if (d) apply(d); }
  header();
  if (!document.documentElement.classList.contains('focus')) { const y = window.scrollY; route(); window.scrollTo(0, y); }
}
const cached = lsGet('saison.data', null); if (cached) apply(cached);
header(); route(); loadData();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadData(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
