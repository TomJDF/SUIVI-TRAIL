<!doctype html>
<html lang="fr"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1011">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Saison">
<title>Saison Restonica 69</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Antonio:wght@500;600;700&family=Montserrat:wght@700;800&family=Barlow:wght@400;500;600&display=swap">
<script>
/* Thème choisi avant le premier rendu, pour éviter un flash */
(function(){ var t = null; try { t = localStorage.getItem('saison.theme'); } catch(e) {}
  if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t); })();
</script>
<style>
/* Trois onglets : Semaine, Saison, Renfo. Chaque onglet commence par un résumé ;
   le détail s'ouvre en sous-page (Jour, Forme, Phase). Pensé pour le téléphone. */
:root{
  --bg:#0B1011; --card:#131A1B; --card-2:#1B2425; --line:#222C2D;
  --ink:#E9EEED; --muted:#8A9B98; --faint:#56645F; --nav:rgba(11,16,17,.92);
  --p0:#E2A469; --pr:#7E8F8C; --p1:#4F9BD9; --p2:#35C9A6; --p3:#E5735C; --p4:#C9B8FF;
  --title:#4A93D9; --on-accent:#06211C;
  --display:'Antonio','Arial Narrow',sans-serif;
  --brand:'Montserrat','Helvetica Neue',Arial,sans-serif;
  --body:'Barlow','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F3F5F4; --card:#FFFFFF; --card-2:#E8EDEC; --line:#DCE3E1;
  --ink:#152021; --muted:#5E6D6A; --faint:#9AA7A4; --nav:rgba(243,245,244,.94);
  --p0:#B26A22; --pr:#6B7A77; --p1:#2B72BA; --p2:#0F8469; --p3:#C24B34; --p4:#6E55CF;
  --title:#1F6FB8; --on-accent:#FFFFFF;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
:focus-visible{outline:2px solid var(--p2);outline-offset:2px;border-radius:6px}

/* En-tête et onglets */
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px max(18px,env(safe-area-inset-right,0px)) 10px max(18px,env(safe-area-inset-left,0px))}
.logo{width:32px;height:32px;border-radius:8px;flex:none;margin-right:-4px}
.brand{font-family:var(--brand);font-weight:800;text-transform:uppercase;color:var(--title);line-height:.9;font-size:15px;letter-spacing:.01em}
.brand span{display:block;text-align:right;font-size:11px}
.cd{margin-left:auto;font-family:var(--display);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.theme{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);color:var(--muted);flex:none}
.theme svg{width:17px;height:17px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--nav);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--faint)}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--p2)}

/* Pages */
.page{max-width:560px;margin:0 auto;padding:20px max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 92px) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.page-h{display:flex;flex-direction:column;gap:4px}
.eyebrow{margin:0;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.page-h h1{margin:0;font-family:var(--display);font-size:32px;font-weight:600;text-transform:uppercase;line-height:1.02;letter-spacing:.01em}
.sub{margin:0;font-size:14px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.back{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;margin:-6px 0 -6px -6px;padding:6px;font-size:14px;font-weight:600;color:var(--p2)}
.back svg{width:16px;height:16px}
.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 2px}
.sec-h h2{margin:0;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.sec-h span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.chev{flex:none;width:8px;height:8px;border-right:1.6px solid var(--faint);border-bottom:1.6px solid var(--faint);transform:rotate(-45deg);margin-right:3px}
.st{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:12px;white-space:nowrap}
.st.ok{background:color-mix(in srgb,var(--p2) 18%,transparent);color:var(--p2)}
.st.mid{background:color-mix(in srgb,var(--p0) 18%,transparent);color:var(--p0)}
.st.low{background:color-mix(in srgb,var(--p3) 18%,transparent);color:var(--p3)}
.st.no{background:var(--card-2);color:var(--muted)}
.go{flex:none;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--on-accent);background:var(--p2);border-radius:20px;padding:9px 16px}
.go.ghost{background:none;color:var(--p2);border:1px solid var(--p2)}
.muted{color:var(--muted)}
.foot{margin:0;font-size:12px;color:var(--faint);text-align:center}

/* Semaine */
.today{padding:16px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.today .k{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--p2)}
.today .t{font-size:17px;font-weight:500;line-height:1.4}
.morning{width:100%;padding:14px 16px;display:flex;align-items:center;gap:12px}
.morning .m{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.morning .k{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.morning .l{font-size:14.5px}
.days{list-style:none;margin:0;padding:0 14px}
.days li{display:flex;align-items:center;border-bottom:1px solid var(--line)}
.days li:last-child{border-bottom:0}
.box{flex:none;width:44px;height:48px;display:grid;place-items:center;margin-left:-10px}
.box i{width:21px;height:21px;border-radius:6px;border:1.5px solid var(--faint);display:grid;place-items:center}
.box svg{width:13px;height:13px;opacity:0;stroke:var(--on-accent)}
.box.on i{background:var(--p2);border-color:var(--p2)}
.box.on svg{opacity:1}
.drow{flex:1;min-width:0;display:grid;grid-template-columns:38px 1fr auto auto;gap:10px;align-items:center;padding:12px 0}
.dj{font-family:var(--display);font-size:14.5px;text-transform:uppercase;letter-spacing:.04em;line-height:1.15}
.dj small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);letter-spacing:0}
.dt{min-width:0;font-size:14.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dm{font-size:12.5px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
li.is-today .dj{color:var(--p2)}
li.is-done .dt{color:var(--muted)}
.wkbar{padding:12px 16px 14px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.wkbar .l{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.wkbar .l b{color:var(--ink);font-weight:600}
.trk{height:5px;background:var(--card-2);border-radius:3px;overflow:hidden}
.trk i{display:block;height:100%;background:var(--c,var(--p2));border-radius:3px}

/* Sous-pages : blocs simples */
.blk{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.blk .k{font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.blk p{margin:0}
.blk .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:4px}
.act{display:flex;flex-direction:column;gap:1px}
.act + .act{padding-top:8px;border-top:1px solid var(--line)}
.act b{font-weight:600}
.act span{font-size:13.5px;color:var(--muted)}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.big3 .v{font-family:var(--display);font-size:28px;font-weight:600;line-height:1.05;font-variant-numeric:tabular-nums}
.big3 .v small{font-family:var(--body);font-size:12px;color:var(--muted);font-weight:500}
.big3 .l{font-size:11px;color:var(--muted);letter-spacing:.04em}
.lines{display:flex;flex-direction:column}
.ln{display:grid;grid-template-columns:10px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.ln:last-child{border-bottom:0}
.ln .d{width:10px;height:10px;border-radius:50%;background:var(--faint)}
.ln .d.ok{background:var(--p2)} .ln .d.mid{background:var(--p0)} .ln .d.low{background:var(--p3)}
.ln .r{color:var(--muted);font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.ln .r b{color:var(--ink);font-weight:600;font-size:14px}
/* Forme : une carte par sujet, 7 cases pour la semaine */
.fnav{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.fnav .nav{display:flex;gap:6px;flex:none}
.fnav .nav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.fnav .nav button:disabled{opacity:.3;cursor:default}
.fnav .nav svg{width:16px;height:16px}
.fcard{width:100%;padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.fh{display:flex;align-items:center;gap:10px;width:100%}
.fh .t{font-family:var(--display);font-size:19px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;line-height:1;white-space:nowrap}
.fh .s{margin-left:auto;font-size:13px;color:var(--muted);text-align:right;line-height:1.3}
.fh .s b{color:var(--ink);font-weight:600}
.rl{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:-6px}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;width:100%}
.strip div{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);min-width:0}
.strip div span.td{color:var(--p2);font-weight:600}
.strip i{width:100%;max-width:44px;aspect-ratio:1;border-radius:8px;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-size:13px;color:var(--ink);border:1px dashed var(--line);white-space:nowrap;overflow:hidden}
.strip i.n{border:0;background:var(--card-2)}
.strip i.ok{border:0;background:color-mix(in srgb,var(--p2) 30%,var(--card-2))}
.strip i.mid{border:0;background:color-mix(in srgb,var(--p0) 32%,var(--card-2))}
.strip i.low{border:0;background:color-mix(in srgb,var(--p3) 30%,var(--card-2));box-shadow:inset 0 0 0 2px var(--p3)}
.strip i.fut{border-style:dotted;opacity:.45}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:62px 1fr;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.hrow:last-child{border-bottom:0}
.hrow .hd{font-family:var(--display);font-size:14px;text-transform:uppercase;letter-spacing:.03em;line-height:1.2}
.hrow .hd small{display:block;font-family:var(--body);font-size:11px;color:var(--muted);letter-spacing:0;text-transform:none}
.hrow .hv{display:flex;flex-direction:column;gap:3px}
.hrow .hv .muted{font-size:13px}
.trend svg{width:100%;height:auto;display:block;touch-action:pan-y}
.trend svg text{font-family:var(--body);font-size:9px;fill:var(--muted)}
.trend .ro{font-size:13px;color:var(--muted);min-height:1.4em;font-variant-numeric:tabular-nums}
.trend .ro b{color:var(--ink);font-weight:600}
.ref{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.ref b{color:var(--ink);font-weight:600}

/* Saison */
.prow{width:100%;display:grid;grid-template-columns:10px 1fr auto 10px;gap:12px;align-items:center;padding:13px 16px;border-bottom:1px solid var(--line)}
.prows > :last-child{border-bottom:0}
.prow .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.prow .n{font-family:var(--display);font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;line-height:1.05}
.prow .n small{display:block;font-family:var(--body);font-size:12.5px;font-weight:400;text-transform:none;letter-spacing:0;color:var(--muted);margin-top:3px}
.prow .dd{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.prow.past .n{color:var(--muted)}
.prow.cur{background:color-mix(in srgb,var(--c) 10%,var(--card))}
.prow.cur .n{color:var(--c)}
.prow .wk{grid-column:2 / 5;display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--muted)}
.race{display:grid;grid-template-columns:54px 1fr auto;gap:2px 12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.races > :last-child{border-bottom:0}
.race .d{font-family:var(--display);font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.race .rn{font-weight:600;font-size:15px;line-height:1.25}
.race .f{grid-column:2;font-size:12.5px;color:var(--muted)}
.race .r{grid-row:1 / 3;grid-column:3;text-align:right;font-size:12.5px;color:var(--muted);white-space:nowrap}
.race .r b{display:block;font-family:var(--display);font-size:17px;color:var(--ink);font-weight:600}
.race.key .rn::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--c);margin-left:7px;transform:translateY(-2px)}
.race.past .d,.race.past .rn{color:var(--muted)}
.race.next{background:color-mix(in srgb,var(--p2) 9%,var(--card))}
.race.next .r b{color:var(--p2);font-size:20px}
.race.final{background:linear-gradient(140deg,color-mix(in srgb,var(--title) 18%,var(--card)) 0%,var(--card) 75%)}
.race.final .rn{font-family:var(--brand);font-weight:800;text-transform:uppercase;color:var(--title);font-size:15px}
.ok-tag{display:inline-block;font-size:10.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--on-accent);background:var(--p2);border-radius:10px;padding:2px 8px}
.focus{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px;font-size:14px}
.focus li{position:relative;padding-left:14px}
.focus li::before{content:"";position:absolute;left:0;top:.62em;width:6px;height:2px;background:var(--c,var(--p2))}
.wk-type{display:grid;grid-template-columns:36px 1fr;gap:6px 10px;font-size:14px;margin:0}
.wk-type dt{font-family:var(--display);color:var(--c);text-transform:uppercase}
.wk-type dd{margin:0}
.wkr{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;font-size:13px}
.wkr .wd{color:var(--muted);font-variant-numeric:tabular-nums}
.wkr .wb{position:relative;height:6px;background:var(--card-2);border-radius:3px}
.wkr .wb i{position:absolute;left:0;top:0;bottom:0;background:var(--c);border-radius:3px}
.wkr .wb b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.45}
.wkr .wv{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.wkr .wv span{color:var(--muted)}
.wkr.fut{opacity:.45}
.wkn{font-size:12.5px;color:var(--muted);margin:-4px 0 4px 50px}

/* Renfo : le carnet est dans la page (le cadre prend la hauteur de son contenu) et c'est la page qui défile.
   Sur iPhone, en appli écran d'accueil, une page bloquée fait remonter les onglets : on ne la bloque pas.
   Pendant une séance, l'en-tête et les onglets disparaissent et la séance prend tout l'écran. */
.page.rf{display:block;max-width:none;margin:0;padding:0 0 calc(env(safe-area-inset-bottom,0px) + 72px);min-height:calc(100vh + 1px);background:var(--bg)}
.page.rf iframe{display:block;width:100%;height:100vh;border:0;background:var(--bg)}
html.focus,html.focus body{overflow:hidden;overscroll-behavior:none}
html.focus .top,html.focus .tabs{display:none}
html.focus .page.rf{position:fixed;inset:0;z-index:30;min-height:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
html.focus .page.rf iframe{flex:1;height:100%;min-height:0}
@media (min-width:600px){ .page.rf{width:560px;margin:0 auto;border-inline:1px solid var(--line)} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <img class="logo" src="logo.svg" alt="" width="32" height="32">
    <div class="brand">Restonica<span>Trail</span></div>
    <div class="cd" id="cd">—</div>
    <button class="theme" id="theme" aria-label="Changer de thème"></button>
  </div>
</header>

<main class="page" id="view"></main>
<main class="page rf" id="p-renfo" hidden><iframe id="rf-frame" title="Carnet de renfo"></iframe></main>

<nav class="tabs" aria-label="Pages">
  <div class="tabs-in">
    <button class="tab" data-p="semaine"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17M8.5 15l2 2 4-4"/></svg>Semaine</button>
    <button class="tab" data-p="forme"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12.5h4l2.5-6 4.5 12 2.5-6h5.5"/></svg>Forme</button>
    <button class="tab" data-p="saison"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19l6-10 4 6 3-4 5 8z"/></svg>Saison</button>
    <button class="tab" data-p="renfo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 9a4 4 0 0 1 8 0"/><circle cx="12" cy="15" r="6"/></svg>Renfo</button>
  </div>
</nav>

<script src="plan.js"></script>
<script>
/* ---------- Outils ---------- */
const D = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const add = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const fmt = d => String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
const iso = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const nf = n => Math.round(n).toLocaleString('fr-FR');
const dec = (n, d) => (+n).toFixed(d).replace('.', ',');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const DAY = 86400000, $ = id => document.getElementById(id);
const JOURS = ['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const longDate = d => JOURS[(d.getDay()+6)%7] + ' ' + d.getDate() + ' ' + MOIS[d.getMonth()];
const hrs = s => { const m = String(s || '').match(/(\d+)\s*h\s*(\d+)?/); return m ? +m[1] + (+(m[2] || 0))/60 : null; };
const hm = h => { const t = Math.round(h*60); return Math.floor(t/60) + 'h' + String(t%60).padStart(2,'0'); };
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch(e) {} };
const CHEV = '<span class="chev" aria-hidden="true"></span>';
const BACK = t => '<button class="back" data-back><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>' + t + '</button>';

let WEEKS = {}, RESULTS = {}, PLANS = {}, SLEEP = {}, PAS = {}, SEANCES = {}, DOS = {}, DOUL = {}, MAJ = '';
let today = new Date(); today.setHours(0,0,0,0);
const S0 = D('2026-10-26'), RACE = D('2027-07-10');
const PIED = ['Run','TrailRun','Hike','Walk','VirtualRun'];

/* ---------- Plan ---------- */
const status = p => today < D(p.start) ? 'future' : (today > D(p.end) ? 'past' : 'current');
const current = () => PHASES.find(p => !p.pre && status(p) === 'current') || PHASES.find(p => status(p) === 'current');
const mondayOf = d => add(d, -((d.getDay()+6)%7));
const weekNo = d => Math.max(1, Math.min(37, Math.floor((mondayOf(d) - S0) / (7*DAY)) + 1));
function weeksOf(p){
  const out = []; for (let w = D(p.start); w <= D(p.end); w = add(w, 7)) out.push(w);
  return out.map((w,i,a) => { const r = a.length > 1 ? i/(a.length-1) : 0;
    return { start:w, key:iso(w), tKm:p.km[0]+(p.km[1]-p.km[0])*r, tDp:p.dp[0]+(p.dp[1]-p.dp[0])*r }; });
}
const targetOf = mon => { for (const p of PHASES){ if (p.pre) continue; const w = weeksOf(p).find(x => x.key === iso(mon)); if (w) return w; } return null; };
function renfoId(s){
  s = String(s).toLowerCase();
  if (s.includes('post-course')) return 'postcourse';
  if (s.includes('programme 1') || s.includes('hanches')) return 'hanches';
  if (s.includes('programme 2') || s.includes('quadri') || s.includes('ischio')) return 'quadri';
  if (s.includes('programme 3') || s.includes('mollets')) return 'mollets';
  if (s.includes('mobilit')) return 'mobilite';
  return null;
}
/* Titre court d'une séance : celui du plan s'il existe, sinon le début du texte */
function titre(j){
  if (j.titre) return j.titre;
  const s = String(j.seance || '').split(/ : |\. | · |\(/)[0].trim();
  return s.length > 44 ? s.slice(0, 42) + '…' : s;
}
function weekPlan(mon){
  const k = iso(mon); let jours;
  if (PLANS[k] && Array.isArray(PLANS[k].jours)) jours = PLANS[k].jours.map(j => Object.assign({}, j));
  else { const p = PHASES.find(x => D(x.start) <= mon && mon <= D(x.end)) || current(); jours = (p ? p.week : []).map(([j,s]) => ({ jour:j, seance:s })); }
  const c = lsGet('saison.coches.' + k, {});
  jours.forEach((j,i) => { const day = iso(add(mon, i)); j.date = day; j.acts = SEANCES[day] || []; j.coche = !!c[i]; j.fait = j.coche || j.acts.length > 0; });
  return { jours, prevu: PLANS[k] && PLANS[k].prevu };
}
function toggleDay(mon, i){
  const k = 'saison.coches.' + iso(mon), c = lsGet(k, {});
  c[i] = !c[i]; lsSet(k, c); route();
}
const vfcSt = v => !v ? 'no' : v >= 80 ? 'ok' : v >= 70 ? 'mid' : 'low';
const VFC_TXT = { ok:'Récupéré', mid:'Correct', low:'Journée facile', no:'Pas de VFC' };
const slpSt = h => h == null ? 'no' : h >= 7 ? 'ok' : h >= 6 ? 'mid' : 'low';
const DOS_ST = { ok:'ok', gene:'mid', douleur:'low' };
const dosTxt = x => x ? (x.score != null ? x.score + '/10' : ({ ok:'rien', gene:'gêne', douleur:'douleur' }[x.etat] || '')) : '';
const footKm = acts => acts.filter(a => PIED.includes(a.type)).reduce((t,a) => t + (+a.km || 0), 0);
function actLine(a){
  return '<div class="act"><b>' + esc(a.nom) + '</b><span>' + [a.km ? dec(a.km, 1) + ' km' : '', a.dp ? nf(a.dp) + ' m D+' : '', a.duree ? esc(a.duree) : '', a.fc ? 'FC ' + a.fc : ''].filter(Boolean).join(' · ') + '</span></div>';
}
function lastNight(){
  if (SLEEP[iso(today)]) return iso(today);
  const k = Object.keys(SLEEP).sort(); return k.length ? k[k.length-1] : null;
}

/* ---------- Thème ---------- */
const SUN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg>';
const MOON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t);
  document.querySelector('meta[name="theme-color"]').content = t === 'light' ? '#F3F5F4' : '#0B1011';
  $('theme').innerHTML = t === 'light' ? MOON : SUN;
  $('theme').setAttribute('aria-label', t === 'light' ? 'Passer en sombre' : 'Passer en clair');

}
$('theme').onclick = () => {
  const t = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  try { localStorage.setItem('saison.theme', t); } catch(e) {}
  applyTheme(t);
};
applyTheme(document.documentElement.getAttribute('data-theme'));

/* ================= SEMAINE ================= */
function vSemaine(){
  const mon = mondayOf(today), w = weekPlan(mon), ti = (today.getDay()+6)%7, p = current();
  const tj = w.jours[ti], rid = tj && renfoId(tj.seance);
  // Aujourd'hui
  let h = '<div class="page-h"><p class="eyebrow">Semaine ' + weekNo(today) + (p ? ' · ' + esc(p.name) : '') + '</p><h1>' + longDate(today) + '</h1></div>';
  if (tj) h += '<div class="card today"><div class="k">Aujourd\'hui</div><div class="t">' + esc(tj.seance) + '</div>' +
    (rid && !tj.fait ? '<button class="go" data-renfo="' + rid + '">Lancer la séance</button>' : '') + '</div>';
  // Ce matin
  const nk = lastNight(), n = nk ? SLEEP[nk] : null, ds = DOS[iso(today)], fresh = nk === iso(today);
  const st = fresh ? vfcSt(+n.vfc) : 'no';
  const bits = fresh ? [n.duree ? esc(n.duree) + ' de sommeil' : '', n.vfc ? 'VFC ' + n.vfc : ''] : ['Pas encore de nuit · ouvre l\'app Suunto'];
  bits.push(ds ? 'dos ' + dosTxt(ds) : 'dos : à me dire');
  h += '<button class="card morning" data-go="#forme"><div class="m"><div class="k">Ce matin</div>' +
    '<div><span class="st ' + st + '">' + (fresh ? VFC_TXT[st] : 'En attente') + '</span></div><div class="l">' + bits.filter(Boolean).join(' · ') + '</div></div>' + CHEV + '</button>';
  // La semaine
  const a = WEEKS[iso(mon)] || {}, tg = targetOf(mon), km = +a.km || 0, dp = +a.dplus || 0;
  h += '<div class="sec"><div class="sec-h"><h2>La semaine</h2><span>' + w.jours.filter(j => j.fait).length + ' / ' + w.jours.length + ' fait</span></div><div class="card"><ul class="days">' +
    w.jours.map((j,i) => {
      const d = add(mon, i), k = footKm(j.acts), meta = k > 0 ? dec(k, k < 10 ? 1 : 0) + ' km' : (j.acts.length ? 'fait' : '');
      return '<li class="' + (i === ti ? 'is-today ' : '') + (j.fait ? 'is-done' : '') + '"><button class="box' + (j.fait ? ' on' : '') + '" data-tog="' + i + '" aria-label="Marquer ' + JOURS[i] + ' comme fait" aria-pressed="' + j.fait + '"><i><svg viewBox="0 0 24 24" fill="none" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></i></button>' +
        '<button class="drow" data-go="#semaine/jour/' + iso(d) + '"><span class="dj">' + esc(j.jour) + '<small>' + fmt(d) + '</small></span><span class="dt">' + esc(titre(j)) + '</span><span class="dm">' + meta + '</span>' + CHEV + '</button></li>';
    }).join('') + '</ul>' +
    '<div class="wkbar"><div class="l"><span><b>' + nf(km) + ' km</b> · ' + nf(dp) + ' m D+</span><span>' + (w.prevu ? esc(String(w.prevu).split(' dont')[0].split(' · ')[0]) : (tg ? '~' + nf(tg.tKm) + ' km' : '')) + '</span></div>' +
    (tg ? '<div class="trk"><i style="width:' + Math.min(100, km / tg.tKm * 100).toFixed(1) + '%"></i></div>' : '') + '</div></div></div>';
  $('view').innerHTML = h;
  $('view').querySelectorAll('[data-tog]').forEach(b => b.onclick = () => toggleDay(mon, +b.dataset.tog));
}

/* Sous-page : un jour */
function vJour(day){
  const d = D(day), mon = mondayOf(d), i = (d.getDay()+6)%7, w = weekPlan(mon), j = w.jours[i] || { seance:'', acts:[] };
  const n = SLEEP[day], ds = DOS[day], fut = d > today, rid = renfoId(j.seance), pas = PAS[day];
  let h = BACK('Semaine') + '<div class="page-h"><p class="eyebrow">' + (day === iso(today) ? 'Aujourd\'hui · ' : '') + longDate(d) + '</p><h1>' + esc(titre(j) || 'Libre') + '</h1></div>';
  if (j.seance) h += '<div class="card blk"><div class="k">Prévu</div><p>' + esc(j.seance) + '</p><div class="acts">' +
    (rid && !j.fait && !fut ? '<button class="go" data-renfo="' + rid + '">Lancer la séance</button>' : '') +
    (!j.acts.length && !fut ? '<button class="go ghost" data-tog="' + i + '">' + (j.coche ? 'Pas fait finalement' : 'Marquer comme fait') + '</button>' : '') + '</div></div>';
  if (j.acts.length) h += '<div class="card blk"><div class="k">Fait</div>' + j.acts.map(actLine).join('') + '</div>';
  if (n) h += '<div class="card blk"><div class="k">Nuit</div><p>' + [n.coucher && n.lever ? esc(n.coucher) + ' → ' + esc(n.lever) : '', n.duree ? esc(n.duree) : '', n.vfc ? 'VFC ' + n.vfc : '', n.fc_min ? 'FC min ' + n.fc_min : ''].filter(Boolean).join(' · ') +
    '</p>' + (n.note ? '<p class="muted">' + esc(n.note) + '</p>' : '') + '</div>';
  if (ds) h += '<div class="card blk"><div class="k">Dos</div><p>' + esc(dosTxt(ds)) + (ds.nuit ? ' · réveils la nuit' : '') + (ds.note && ds.note !== dosTxt(ds) + ' au réveil' ? ' <span class="muted">· ' + esc(ds.note) + '</span>' : '') + '</p></div>';
  if (pas >= 1500) h += '<p class="foot">' + nf(pas) + ' pas ce jour-là</p>';
  if (!j.seance && !j.acts.length && !n && !ds) h += '<p class="sub">Rien d\'enregistré ce jour-là.</p>';
  $('view').innerHTML = h;
  $('view').querySelectorAll('[data-tog]').forEach(b => b.onclick = () => toggleDay(mon, +b.dataset.tog));
}

/* ================= FORME : dos, douleurs, sommeil, pas ================= */
let fMon = null;
const J3 = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const sev = x => x.score != null ? +x.score : ({ ok:0, gene:2, douleur:5 }[x.etat] || 0);
const sevSt = n => n <= 0 ? 'ok' : n <= 3 ? 'mid' : 'low';
const avgOf = a => a.length ? a.reduce((t,x) => t + x, 0) / a.length : null;
/* 7 cases pour la semaine ; cell(k) renvoie [classe, texte] ou rien */
function strip(mon, cell){
  return '<div class="strip">' + [...Array(7)].map((_,i) => {
    const d = add(mon, i), k = iso(d), c = d > today ? ['fut',''] : (cell(k) || ['','']);
    return '<div><i class="' + c[0] + '">' + esc(c[1]) + '</i><span' + (k === iso(today) ? ' class="td"' : '') + '>' + J3[i] + '</span></div>';
  }).join('') + '</div>';
}
function vForme(){
  const cur = mondayOf(today), keys = Object.keys(SLEEP).concat(Object.keys(DOS), Object.keys(DOUL), Object.keys(PAS)).sort();
  const first = keys.length ? mondayOf(D(keys[0])) : cur;
  if (!fMon || fMon > cur) fMon = cur;
  if (fMon < first) fMon = first;
  const isCur = iso(fMon) === iso(cur), days = [...Array(7)].map((_,i) => iso(add(fMon, i))).filter(k => D(k) <= today);
  let h = '<div class="fnav"><div class="page-h"><p class="eyebrow">' + (isCur ? 'Cette semaine' : 'Semaine ' + weekNo(fMon)) + ' · ' + fmt(fMon) + ' → ' + fmt(add(fMon, 6)) + '</p><h1>Forme</h1></div>' +
    '<div class="nav"><button id="f-prev" aria-label="Semaine précédente"' + (fMon <= first ? ' disabled' : '') + '><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>' +
    '<button id="f-next" aria-label="Semaine suivante"' + (isCur ? ' disabled' : '') + '><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button></div></div>';
  const card = (go, t, sum, body) => { const tag = go ? 'button' : 'div';
    return '<' + tag + ' class="card fcard"' + (go ? ' data-go="' + go + '"' : '') + '><div class="fh"><span class="t">' + t + '</span><span class="s">' + sum + '</span>' + (go ? CHEV : '') + '</div>' + body + '</' + tag + '>'; };
  // Dos
  const dd = days.map(k => DOS[k]).filter(Boolean), gene = dd.filter(x => sev(x) > 0).length, mx = dd.length ? Math.max(...dd.map(sev)) : 0;
  h += card('#forme/dos', 'Dos', dd.length ? (gene ? '<b>' + gene + ' jour' + (gene > 1 ? 's' : '') + '</b> de gêne' + (dd.some(x => x.score != null) ? ' · max ' + Math.max(...dd.filter(x => x.score != null).map(x => +x.score)) + '/10' : '') : 'rien à signaler') : 'pas encore noté',
    strip(fMon, k => { const x = DOS[k]; return x ? [DOS_ST[x.etat] || 'n', x.score != null ? x.score : x.etat === 'ok' ? '0' : ''] : null; }));
  // Autres douleurs
  const pd = days.flatMap(k => DOUL[k] || []).filter(x => sev(x) > 0), zones = [...new Set(pd.map(x => x.zone))];
  h += card('#forme/douleurs', 'Douleurs', zones.length ? '<b>' + esc(zones.join(', ')) + '</b>' : 'rien de signalé',
    strip(fMon, k => { const a = DOUL[k]; if (!a || !a.length) return null; const m = Math.max(...a.map(sev)), sc = a.filter(x => x.score != null).map(x => +x.score); return [sevSt(m), sc.length ? Math.max(...sc) : m > 0 ? '' : '0']; }));
  // Sommeil
  const nights = days.map(k => SLEEP[k]).filter(Boolean), aH = avgOf(nights.map(x => hrs(x.duree)).filter(x => x != null)), aV = avgOf(nights.map(x => +x.vfc).filter(Boolean));
  h += card('#forme/sommeil', 'Sommeil', nights.length ? 'moy. <b>' + hm(aH) + '</b>' + (aV ? ' · VFC <b>' + Math.round(aV) + '</b>' : '') : 'pas de nuit',
    '<div class="rl">Durée</div>' + strip(fMon, k => { const n = SLEEP[k], x = n && hrs(n.duree); return x != null ? [slpSt(x), hm(x)] : null; }) +
    '<div class="rl">VFC</div>' + strip(fMon, k => { const n = SLEEP[k]; return n && n.vfc ? [vfcSt(+n.vfc), n.vfc] : null; }));
  // Pas
  const worn = days.map(k => PAS[k]).filter(v => v != null && v >= 1500);
  h += card('', 'Pas', worn.length ? 'moy. <b>' + nf(avgOf(worn)) + '</b> · ' + worn.length + ' jour' + (worn.length > 1 ? 's' : '') : 'montre pas portée la journée',
    strip(fMon, k => PAS[k] == null ? null : PAS[k] >= 1500 ? ['n', dec(PAS[k] / 1000, PAS[k] >= 10000 ? 0 : 1) + 'k'] : ['', '–']));
  h += '<p class="foot">Nuit et pas : la montre, relevés chaque matin à 8 h · dos et douleurs : ce que tu me dis</p>';
  $('view').innerHTML = h;
  $('f-prev').onclick = () => { fMon = add(fMon, -7); route(); };
  $('f-next').onclick = () => { fMon = add(fMon, 7); route(); };
}
/* Liste jour par jour (le plus récent en haut) */
const hrow = (k, main, sub) => '<div class="hrow"><span class="hd">' + J3[(D(k).getDay()+6)%7] + '<small>' + fmt(D(k)) + '</small></span><span class="hv"><span>' + main + '</span>' + (sub ? '<span class="muted">' + sub + '</span>' : '') + '</span></div>';
function vDos(){
  const ks = Object.keys(DOS).sort().reverse().slice(0, 28);
  let h = BACK('Forme') + '<div class="page-h"><p class="eyebrow">Au réveil, sur 10</p><h1>Dos</h1><p class="sub">Stop la série ou la sortie si ça dépasse 3/10.</p></div>';
  h += '<div class="card blk hist">' + (ks.length ? ks.map(k => { const x = DOS[k];
    return hrow(k, '<span class="st ' + (DOS_ST[x.etat] || 'no') + '">' + esc(x.score != null ? x.score + '/10' : ({ ok:'Rien', gene:'Gêne', douleur:'Douleur' }[x.etat] || '—')) + '</span>' + (x.nuit ? ' <span class="muted">réveils la nuit</span>' : x.nuit === false ? ' <span class="muted">nuit sans réveil</span>' : ''),
      x.note && !/^\d+\/10 au réveil$/.test(x.note) ? esc(x.note) : ''); }).join('') : '<p class="muted">Rien de noté pour l\'instant.</p>') + '</div>';
  $('view').innerHTML = h;
}
function vDouleurs(){

  let h = BACK('Forme') + '<div class="page-h"><p class="eyebrow">Hors dos</p><h1>Autres douleurs</h1><p class="sub">Aine, mollet, cuisse… dis-moi dès que quelque chose tire, je le note ici.</p></div>';
  h += '<div class="card blk hist">' + (ks.length ? ks.map(k => (DOUL[k]).map(x => hrow(k,
      '<b>' + esc(x.zone) + '</b> <span class="st ' + sevSt(sev(x)) + '">' + esc(x.score != null ? x.score + '/10' : ({ ok:'passé', gene:'gêne', douleur:'douleur' }[x.etat] || '')) + '</span>',
      x.note ? esc(x.note) : '')).join('')).join('') : '<p class="muted">Rien de signalé.</p>') + '</div>';
  $('view').innerHTML = h;
}
function vSommeil(){
  const nk = lastNight(), n = nk ? SLEEP[nk] : {}, st = vfcSt(+n.vfc), fresh = nk === iso(today);
  let h = BACK('Forme') + '<div class="page-h"><p class="eyebrow">' + (nk ? (fresh ? 'Nuit dernière' : 'Nuit du ' + fmt(add(D(nk), -1)) + ' au ' + fmt(D(nk))) : 'Sommeil') + '</p><h1>' + (nk ? VFC_TXT[st] : 'Pas de nuit') + '</h1>' +
    (nk ? '<p class="sub">' + (st === 'low' ? 'On allège la séance du jour.' : st === 'mid' ? 'Séance prévue, sans forcer.' : st === 'ok' ? 'Feu vert pour la séance prévue.' : '') + '</p>' : '') + '</div>';
  if (nk) h += '<div class="card blk"><div class="big3">' +
      '<div><div class="v">' + (n.vfc || '—') + ' <small>ms</small></div><div class="l">VFC</div></div>' +
      '<div><div class="v">' + (n.fc_min || '—') + ' <small>bpm</small></div><div class="l">FC min</div></div>' +
      '<div><div class="v">' + (hrs(n.duree) != null ? hm(hrs(n.duree)) : '—') + '</div><div class="l">Sommeil</div></div></div>' +
      (n.coucher && n.lever ? '<p class="muted">' + esc(n.coucher) + ' → ' + esc(n.lever) + (n.eveil_min ? ' · éveillé ' + n.eveil_min + ' min' : '') + '</p>' : '') +
      (n.note ? '<p class="muted">' + esc(n.note) + '</p>' : '') + '</div>';
  h += '<div class="card blk trend" id="f-trend"></div>';
  const ks = Object.keys(SLEEP).sort().reverse().slice(0, 14);
  h += '<div class="sec"><div class="sec-h"><h2>Les dernières nuits</h2></div><div class="card blk hist">' + ks.map(k => { const x = SLEEP[k];
    return hrow(k, (x.duree ? '<b>' + esc(hrs(x.duree) != null ? hm(hrs(x.duree)) : x.duree) + '</b>' : '') + (x.vfc ? ' · VFC <b>' + x.vfc + '</b>' : '') + (x.fc_min ? ' · FC min ' + x.fc_min : ''),
      [x.coucher && x.lever ? esc(x.coucher) + ' → ' + esc(x.lever) : '', x.note ? esc(x.note) : ''].filter(Boolean).join(' · ')); }).join('') + '</div></div>';
  h += '<p class="ref"><b>VFC 80-90</b> : récupéré · <b>70-79</b> : correct · <b>sous 70</b> : journée facile · FC min repère <b>47-51</b> · sommeil <b>7 h</b> et plus.</p>';
  $('view').innerHTML = h;
  trend($('f-trend'));
}
/* VFC et durée de sommeil sur 21 jours : deux petits graphiques l'un sous l'autre, un seul axe chacun */
function trend(box){
  const N = 21, days = [...Array(N)].map((_,i) => add(today, i - N + 1));
  const W = 320, H1 = 92, G = 18, H2 = 46, H = H1 + G + H2 + 16, L = 4, R = 4, step = (W - L - R) / N, cx = i => L + step * (i + .5);
  const lo = 50, hi = 110, yv = v => 14 + (hi - Math.max(lo, Math.min(hi, v))) / (hi - lo) * (H1 - 20), y2 = h => H1 + G + H2 - Math.min(11, h) / 11 * H2;
  const data = days.map(d => { const n = SLEEP[iso(d)] || {}; return { d, v:+n.vfc || null, h:hrs(n.duree), f:+n.fc_min || null }; });
  let s = '<text x="' + L + '" y="9">VFC (ms)</text><text x="' + L + '" y="' + (H1 + G - 3) + '">Sommeil (h)</text>';
  s += '<rect x="0" y="' + yv(90).toFixed(1) + '" width="' + W + '" height="' + (yv(80) - yv(90)).toFixed(1) + '" fill="var(--p2)" opacity=".13"/>';
  s += '<line x1="0" x2="' + W + '" y1="' + yv(70).toFixed(1) + '" y2="' + yv(70).toFixed(1) + '" stroke="var(--p3)" stroke-dasharray="3 3" opacity=".7"/>';
  s += '<text x="' + (W - R) + '" y="' + (yv(90) - 3).toFixed(1) + '" text-anchor="end">80-90</text><text x="' + (W - R) + '" y="' + (yv(70) + 10).toFixed(1) + '" text-anchor="end">70</text>';
  s += '<path d="' + data.map((p,i) => p.v ? ((i && data[i-1].v ? 'L' : 'M') + cx(i).toFixed(1) + ' ' + yv(p.v).toFixed(1)) : '').join(' ') + '" fill="none" stroke="var(--p2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>';
  s += data.map((p,i) => p.v ? '<circle cx="' + cx(i).toFixed(1) + '" cy="' + yv(p.v).toFixed(1) + '" r="3.4" fill="var(--p2)" stroke="var(--card)" stroke-width="2"/>' : '').join('');
  s += '<line x1="0" x2="' + W + '" y1="' + y2(7).toFixed(1) + '" y2="' + y2(7).toFixed(1) + '" stroke="var(--muted)" stroke-dasharray="3 3" opacity=".6"/><text x="' + (W - R) + '" y="' + (y2(7) - 3).toFixed(1) + '" text-anchor="end">7 h</text>';
  s += data.map((p,i) => p.h != null ? '<rect x="' + (cx(i) - step/2 + 1.5).toFixed(1) + '" y="' + y2(p.h).toFixed(1) + '" width="' + (step - 3).toFixed(1) + '" height="' + (H1 + G + H2 - y2(p.h)).toFixed(1) + '" rx="2.5" fill="var(--p4)" opacity=".85"/>' : '').join('');
  s += '<line id="f-x" x1="-10" x2="-10" y1="0" y2="' + (H1 + G + H2) + '" stroke="var(--ink)" stroke-width="1" opacity=".5"/>';
  s += [0, 7, 14, 20].map(i => '<text x="' + cx(i).toFixed(1) + '" y="' + (H - 3) + '" text-anchor="middle">' + fmt(days[i]) + '</text>').join('');
  box.innerHTML = '<div class="k">3 dernières semaines</div><svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="VFC et durée de sommeil sur 21 jours">' + s + '</svg><div class="ro" id="f-ro">Touche le graphique pour lire une nuit.</div>';
  const el = box.querySelector('svg');
  const read = e => {
    const r = el.getBoundingClientRect(), i = Math.max(0, Math.min(N - 1, Math.floor(((e.clientX - r.left) / r.width * W - L) / step))), p = data[i];
    $('f-x').setAttribute('x1', cx(i)); $('f-x').setAttribute('x2', cx(i));
    $('f-ro').innerHTML = JOURS[(p.d.getDay()+6)%7].slice(0,3) + '. ' + fmt(p.d) + ' · ' + (p.v || p.h != null ? 'VFC <b>' + (p.v || '—') + '</b> · sommeil <b>' + (p.h != null ? hm(p.h) : '—') + '</b>' + (p.f ? ' · FC min ' + p.f : '') : 'pas de nuit enregistrée');
  };
  el.addEventListener('pointermove', read); el.addEventListener('pointerdown', read);
}

/* ================= SAISON ================= */
const ALL_RACES = () => Object.assign({}, RACES, { resto:{ d:'2027-07-10', label:'10/07', name:'Restonica Trail', f:'69 km · 3 950 D+ · départ 2h, Corte', key:true, final:true } });
function vSaison(){
  const cur = current();
  let h = '<div class="page-h"><p class="eyebrow">Saison 2026 – 2027</p><h1>Vers la Restonica</h1><p class="sub">Semaine ' + weekNo(today) + ' sur 37</p></div>';
  // Le plan : la phase en cours est ouverte, les autres en une ligne
  h += '<div class="sec"><div class="sec-h"><h2>Le plan</h2></div><div class="card prows">' + PHASES.filter(p => !p.pre).map(p => {
    const st = status(p), isCur = cur && cur.id === p.id;
    let extra = '';
    if (isCur){
      const ws = weeksOf(p), wi = ws.findIndex(w => w.key === iso(mondayOf(today))) + 1;
      extra = '<div class="wk"><span>Semaine ' + wi + ' sur ' + ws.length + ' du bloc</span><div class="trk"><i style="width:' + (wi / ws.length * 100).toFixed(0) + '%;--c:var(' + p.c + ')"></i></div></div>';
    }
    return '<button class="prow ' + st + (isCur ? ' cur' : '') + '" style="--c:var(' + p.c + ')" data-go="#saison/phase/' + p.id + '"><span class="dot"></span><span class="n">' + esc(p.name) + (isCur ? '<small>' + esc(p.sub) + '</small>' : '') + '</span>' +
      '<span class="dd">' + fmt(D(p.start)) + ' → ' + fmt(D(p.end)) + '</span>' + CHEV + extra + '</button>';
  }).join('') + '</div></div>';
  // Les courses : à venir d'abord, résultats ensuite
  const races = Object.entries(ALL_RACES()).sort((a,b) => a[1].d.localeCompare(b[1].d));
  const todo = races.filter(([k,r]) => D(r.d) >= today), done = races.filter(([k,r]) => D(r.d) < today).reverse();
  const colorOf = k => { const p = PHASES.find(x => x.races.includes(k)); return p ? p.c : '--title'; };
  const row = ([k,r], i, past) => {
    const res = RESULTS[k], days = Math.ceil((D(r.d) - today) / DAY), isNext = !past && i === 0;
    const right = past ? (res ? '<b>' + esc(res.temps || '') + '</b>' + esc(res.place || '') : '') : r.final ? '<span class="ok-tag">Inscrit</span>' : (isNext ? '<b>J-' + days + '</b>' : '');
    return '<div class="race' + (r.key ? ' key' : '') + (past ? ' past' : '') + (isNext && !r.final ? ' next' : '') + (r.final ? ' final' : '') + '" style="--c:var(' + colorOf(k) + ')"><span class="d">' + esc(r.label) + '</span>' +
      '<span class="rn">' + esc(r.name) + '</span><span class="r">' + right + '</span><span class="f">' + esc(r.f) + (r.note && !past ? ' · ' + esc(r.note) : '') + '</span></div>';
  };
  h += '<div class="sec"><div class="sec-h"><h2>Courses à venir</h2><span>le point = course clé</span></div><div class="card races">' + todo.map((x,i) => row(x, i, false)).join('') + '</div></div>';
  if (done.length) h += '<div class="sec"><div class="sec-h"><h2>Résultats</h2></div><div class="card races">' + done.map((x,i) => row(x, i, true)).join('') + '</div></div>';
  $('view').innerHTML = h;
}

/* Sous-page : une phase */
function vPhase(id){
  const p = PHASES.find(x => x.id === id); if (!p) return go('saison');
  const st = status(p);
  let h = BACK('Saison') + '<div class="page-h" style="--c:var(' + p.c + ')"><p class="eyebrow">' + fmt(D(p.start)) + ' → ' + fmt(D(p.end)) + (st === 'current' ? ' · en cours' : st === 'past' ? ' · terminé' : '') + '</p><h1>' + esc(p.name) + '</h1><p class="sub">' + esc(p.sub) + '</p></div>';
  h += '<div class="card blk" style="--c:var(' + p.c + ')"><div class="k">Points clés</div><ul class="focus">' + p.focus.map(f => '<li>' + esc(f) + '</li>').join('') + '</ul></div>';
  if (p.week.length) h += '<div class="card blk" style="--c:var(' + p.c + ')"><div class="k">Semaine type</div><dl class="wk-type">' + p.week.map(([j,s]) => '<dt>' + j + '</dt><dd>' + esc(s) + '</dd>').join('') + '</dl></div>';
  const weeks = weeksOf(p), max = Math.max(1, ...weeks.map(w => Math.max(w.tKm, +(WEEKS[w.key] || {}).km || 0))) * 1.1;
  h += '<div class="card blk" style="--c:var(' + p.c + ')"><div class="k">Semaine par semaine' + (p.pre ? '' : ' · le trait = objectif') + '</div><div class="lines">' + weeks.map(w => {
    const a = WEEKS[w.key], k = a ? +a.km || 0 : 0, d = a ? +a.dplus || 0 : 0;
    return '<div class="wkr' + (w.start > today ? ' fut' : '') + '" style="padding:7px 0"><span class="wd">' + fmt(w.start) + '</span>' +
      '<div class="wb"><i style="width:' + (k / max * 100).toFixed(1) + '%"></i>' + (p.pre ? '' : '<b style="left:calc(' + (w.tKm / max * 100).toFixed(1) + '% - 1px)"></b>') + '</div>' +
      '<span class="wv">' + (a ? nf(k) + ' km · ' + nf(d) + ' m' : '<span>' + nf(w.tKm) + ' km · ' + nf(w.tDp) + ' m</span>') + '</span></div>' +
      (a && a.note ? '<div class="wkn">' + esc(a.note) + '</div>' : '');
  }).join('') + '</div></div>';
  $('view').innerHTML = h;
}

/* ================= NAVIGATION ================= */
/* #semaine, #semaine/jour/AAAA-MM-JJ, #semaine/forme, #saison, #saison/phase/<id>, #renfo */
const TABS = ['semaine','forme','saison','renfo'], mem = {};
let curKey = null, fromApp = false;
function route(){
  const parts = location.hash.slice(1).split('/'), tab = TABS.includes(parts[0]) ? parts[0] : 'semaine', key = parts.join('/') || 'semaine';
  if (curKey && curKey !== key) mem[curKey] = window.scrollY;
  const isRf = tab === 'renfo';
  $('view').hidden = isRf; $('p-renfo').hidden = !isRf;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-current', t.dataset.p === tab ? 'page' : 'false'));
  if (!isRf) document.documentElement.classList.remove('focus');
  if (isRf) loadRenfo().then(sizeRenfo);
  else if (parts[1] === 'jour' && /^\d{4}-\d{2}-\d{2}$/.test(parts[2] || '')) vJour(parts[2]);
  else if (tab === 'forme' && parts[1] === 'dos') vDos();
  else if (tab === 'forme' && parts[1] === 'douleurs') vDouleurs();
  else if (tab === 'forme' && parts[1] === 'sommeil') vSommeil();
  else if (tab === 'forme' || parts[1] === 'forme') vForme();
  else if (tab === 'saison' && parts[1] === 'phase') vPhase(parts[2]);
  else if (tab === 'saison') vSaison();
  else vSemaine();
  const isSub = parts.length > 1;
  if (curKey !== key) window.scrollTo(0, isSub ? 0 : (mem[key] || 0));
  curKey = key;
}
function go(h, push){
  h = '#' + h.replace(/^#/, '');
  if (location.hash === h) return route();
  if (push) { fromApp = true; location.hash = h; }
  else { history.replaceState(null, '', h); route(); }
}
document.querySelectorAll('.tab').forEach(t => t.onclick = () => { const p = t.dataset.p; mem[p] = 0; fromApp = false; go(p); });
document.addEventListener('click', e => {
  const g = e.target.closest('[data-go]'); if (g) { go(g.dataset.go, true); return; }
  const b = e.target.closest('[data-back]'); if (b) { if (fromApp) history.back(); else go(location.hash.slice(1).split('/')[0]); return; }
  const r = e.target.closest('[data-renfo]'); if (r) openRenfo(r.dataset.renfo);
});
window.addEventListener('hashchange', route);

/* ================= RENFO ================= */
let rfLoaded = null;
function loadRenfo(){
  const fr = $('rf-frame');
  if (!rfLoaded) rfLoaded = new Promise(r => { fr.onload = () => {
    applyTheme(document.documentElement.getAttribute('data-theme'));
    try { const w = fr.contentWindow, app = w.document.querySelector('.app'); if (app && w.ResizeObserver) new w.ResizeObserver(sizeRenfo).observe(app); } catch(e) {}
    sizeRenfo(); r();
  }; fr.src = 'renfo.html'; });
  return rfLoaded;
}
/* Hors séance, le cadre fait la hauteur du carnet (la page défile) ; en séance, il prend tout l'écran. */
function sizeRenfo(){
  const fr = $('rf-frame'); let doc;
  try { doc = fr.contentDocument; } catch(e) { return; }
  if (!doc || !doc.documentElement) return;
  const focus = document.documentElement.classList.contains('focus');
  doc.documentElement.classList.toggle('flow', !focus);
  if (focus){ fr.style.height = ''; return; }
  const app = doc.querySelector('.app'), h = Math.ceil(app ? app.getBoundingClientRect().height : doc.body.scrollHeight);
  if (h > 0) fr.style.height = h + 'px';
}
async function openRenfo(id){
  go('renfo'); await loadRenfo();
  try { $('rf-frame').contentWindow.start(id); } catch(e) {}
}
window.addEventListener('message', e => {
  const m = e.data; if (!m || e.source !== $('rf-frame').contentWindow) return;
  if (m.type === 'renfo-screen'){
    const was = document.documentElement.classList.contains('focus'), now = m.screen === 'session';
    document.documentElement.classList.toggle('focus', now); sizeRenfo();
    if (was && !now) window.scrollTo(0, 0);
    return;
  }
  if (m.type !== 'renfo-done') return;
  const mon = mondayOf(today), ti = (today.getDay()+6)%7, j = weekPlan(mon).jours[ti];
  if (j && !j.fait && renfoId(j.seance) === m.id){ const k = 'saison.coches.' + iso(mon), c = lsGet(k, {}); c[ti] = true; lsSet(k, c); }
});

/* ================= DONNÉES ================= */
function apply(d){
  WEEKS = d.semaines || {}; RESULTS = d.resultats || {}; PLANS = d.plan || {}; SLEEP = d.sommeil || {};
  PAS = d.pas || {}; SEANCES = d.seances || {}; DOS = d.dos || {}; DOUL = d.douleurs || {}; MAJ = d.maj || '';
}
function header(){ const d = Math.ceil((RACE - today) / DAY); $('cd').textContent = d > 0 ? 'J-' + d : 'Jour J'; }
async function loadData(){
  today = new Date(); today.setHours(0,0,0,0);
  try {
    const r = await fetch('data.json?t=' + Date.now(), { cache:'no-store' });
    if (!r.ok) throw new Error(r.status);
    const d = await r.json(); apply(d); lsSet('saison.data', d);
  } catch(e) { const d = lsGet('saison.data', null); if (d) apply(d); }
  header();
  if (!document.documentElement.classList.contains('focus')) { const y = window.scrollY; route(); window.scrollTo(0, y); }
}
const cached = lsGet('saison.data', null); if (cached) apply(cached);
header(); route(); loadData();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadData(); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body></html>
